# Define listening port
http_port 3128

# Allowed target domain(s): one per line in allowed_domains.txt (gitignored,
# see allowed_domains.example.txt), mounted to /etc/squid/allowed_domains.txt
acl allowed_llm_domains dstdomain "/etc/squid/allowed_domains.txt"

# Standard ports for HTTPS and HTTP
acl ssl_ports port 443
acl safe_ports port 80
acl safe_ports port 443
acl connect_method method CONNECT

# 1. Deny unknown ports
http_access deny !safe_ports
http_access deny connect_method !ssl_ports

# 2. Allow connections exclusively to your LLM endpoint
http_access allow allowed_llm_domains

# 3. Deny everything else
http_access deny all

# Optimization: Turn off caching for API calls
cache deny all
